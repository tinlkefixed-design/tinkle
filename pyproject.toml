[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkle"
version = "2.54.0"
description = "Tinkle — Integrated System (Phases 1-33 + Phase 50.1-50.17)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sympy>=1.13,<2",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "polars>=1.0,<2",
  "torch>=2.0,<3",
  "redis>=5,<7",
  "qdrant-client>=1.10,<2",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["tinkle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
